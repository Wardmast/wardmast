{{- if include "wardmast-node.node" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wardmast-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wardmast-node.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wardmast-controller
subjects:
  - kind: ServiceAccount
    name: wardmast-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
