{{- if include "wardmast-node.bootstrap" . }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: wardmast-workers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wardmast-node.labels" . | nindent 4 }}
spec:
  hard:
    {{- include "wardmast-node.quantities" .Values.quota.hard | trim | nindent 4 }}
{{- end }}
