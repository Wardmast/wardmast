name: Build and Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release (e.g. v0.1.0)"
        required: true
      sign:
        description: "Sign the GHCR images and chart with cosign (keyless)"
        type: boolean
        default: false

jobs:
  build:
    name: Build OTP Release
    # Pinned: ubuntu-latest moved to 26.04 and breaks tests; see 26.04 follow-up ticket (#1529).
    runs-on: ubuntu-24.04
    container:
      image: redhat/ubi8

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.tag.outputs.name }}

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      ELIXIR_ERL_OPTIONS: "+fnu"
      MIX_ENV: prod
      # Stamped into the server release and the arb escript so `arb server
      # deploy` / `arb self-update` find their release source with no
      # ARB_RELEASE_REPO exported (WardmastCli.ReleaseRepo, Wardmast.Version).
      ARB_BUILD_RELEASE_REPO: ${{ github.repository }}
      # Build every `rustler_precompiled` NIF from source inside this
      # container instead of downloading upstream's prebuilt artifact.
      #
      # Only `mdex_native` uses rustler_precompiled today, and its upstream
      # x86_64-unknown-linux-gnu artifact is linked against a glibc newer
      # than ubi8's: it requires symbols up to GLIBC_2.34, so v0.1.64 could
      # not boot on RHEL 8.10 / glibc 2.28 at all (#1728) — `kernel` died in
      # `on_load` and the deploy auto-rolled back. Building it here links it
      # against this image's glibc 2.28, which makes the release portable to
      # every host at or above the build image, the same as every other `.so`
      # we ship. The "Check shipped binaries…" step below enforces that.
      #
      # This is release-only: dev machines and the PR CI job leave the
      # variable unset and keep using the downloaded artifact, so they need
      # no Rust toolchain.
      RUSTLER_PRECOMPILED_FORCE_BUILD_ALL: "1"

    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            git \
            curl \
            make \
            gcc \
            gcc-c++ \
            binutils \
            perl \
            perl-IPC-Cmd \
            ncurses-devel \
            unzip \
            tar \
            gzip \
            skopeo \
            which \
            glibc-langpack-en

      - uses: actions/checkout@v4

      # Erlang/OTP is built from source here, with OpenSSL linked statically
      # into the crypto NIF (#1977). The rabbitmq el8 RPM used until v0.1.69
      # linked it against this image's libcrypto.so.1.1, so the release could
      # not boot on any OpenSSL-3-only host (Fedora >= 36, Ubuntu >= 22.04,
      # Debian >= 12, RHEL 9). Versions and checksums are pinned in the
      # script; the cache is keyed on its contents. The "Check shipped
      # binaries…" steps below enforce the outcome on the packaged tarball.
      - name: Restore Erlang/OTP build cache
        id: otp-cache
        uses: actions/cache@v4
        with:
          path: /opt/otp
          key: otp-static-openssl-ubi8-${{ hashFiles('scripts/build-release-otp.sh') }}

      - name: Build Erlang/OTP 29 with static OpenSSL
        if: steps.otp-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/build-release-otp.sh --prefix /opt/otp

      - name: Put Erlang/OTP on PATH
        run: |
          echo "/opt/otp/bin" >> "$GITHUB_PATH"
          /opt/otp/bin/erl -noshell -eval 'ok = crypto:start(), io:format("~p~n", [crypto:info_lib()]), halt().'

      - name: Install Elixir 1.20
        run: |
          ELIXIR_VERSION="1.20.4"
          OTP_MAJOR="29"
          curl -fsSL "https://repo.hex.pm/builds/elixir/v${ELIXIR_VERSION}-otp-${OTP_MAJOR}.zip" -o /tmp/elixir.zip
          mkdir -p /opt/elixir
          unzip -q /tmp/elixir.zip -d /opt/elixir
          echo "/opt/elixir/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        # Needed only because RUSTLER_PRECOMPILED_FORCE_BUILD_ALL is set for
        # this job (see the job `env` above): the mdex_native NIF is compiled
        # here rather than downloaded. Keep RUST_VERSION at or above the
        # `rust-version` in deps/mdex_native/native/mdex_native_nif/Cargo.toml.
        run: |
          RUST_VERSION="1.91.0"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "${RUST_VERSION}" --no-modify-path
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          "${HOME}/.cargo/bin/cargo" --version
          "${HOME}/.cargo/bin/rustc" --version

      - name: Verify UTF-8 locale
        run: |
          locale
          python3 -c "import locale; print(locale.getlocale())" || true

      - name: Bootstrap Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Determine tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Get production dependencies
        run: |
          MIX_ENV=prod mix deps.get --only prod

      - name: Install asset build tools
        run: |
          MIX_ENV=prod mix cmd --app wardmast_web mix assets.setup
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}
          MIX_ENV: prod

      - name: Compile (prod)
        run: |
          MIX_ENV=prod mix compile
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}
          MIX_ENV: prod

      - name: Build and digest web assets
        run: |
          MIX_ENV=prod mix cmd --app wardmast_web mix assets.deploy

      - name: Build OTP release
        run: |
          MIX_ENV=prod mix release wardmast
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}
          MIX_ENV: prod

      - name: Build ward escript
        run: |
          cd apps/wardmast_cli && MIX_ENV=prod mix escript.build
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}
          MIX_ENV: prod

      - name: Package and checksum release
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          TARBALL="arbiter-${TAG}-linux.tar.gz"
          # bd-d5mg29: bin/ward (overlay) runs this escript on the bundled erts.
          cp apps/wardmast_cli/ward _build/prod/rel/wardmast/bin/ward.escript
          scripts/check-release-ward.sh _build/prod/rel/wardmast apps/wardmast_cli/ward
          tar -czf "${TARBALL}" -C _build/prod/rel/wardmast .
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          sha256sum apps/wardmast_cli/ward > ward.sha256
          # TRANSITION (remove next release): pre-rename CLIs only look for an
          # `arb` asset in self-update / server deploy / CliFetcher. Publish the
          # same escript under that name so they can cross the rename.
          cp apps/wardmast_cli/ward arb
          sha256sum arb > arb.sha256
          # One migration name per line: lets a running server tell, before an
          # operator clicks "Update", whether the release carries migrations it
          # has not applied (Wardmast.Release.UpdateCheck).
          MANIFEST="arbiter-${TAG}-migrations.txt"
          (cd apps/wardmast/priv/repo/migrations && ls -1 *.exs | sed 's/\.exs$//' | sort) > "${MANIFEST}"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"
          echo "MANIFEST=${MANIFEST}" >> "$GITHUB_ENV"

      - name: Check shipped binaries against the ubi8 glibc baseline
        # Last line of defence for #1728: fail the release here, naming the
        # file, rather than shipping a tarball that cannot boot on RHEL 8.
        # Runs against the packaged tarball, i.e. exactly what gets published.
        # Locally: scripts/check-release-glibc.sh _build/prod/rel/wardmast
        run: |
          bash scripts/check-release-glibc.sh --baseline 2.28 "${TARBALL}"

      - name: Check shipped binaries only link always-present system libraries
        # Last line of defence for #1977: a bundled .so / ELF binary whose
        # NEEDED libraries include anything outside the allowlist in the
        # script (glibc family, libgcc_s, libstdc++, libtinfo) fails the
        # release here, naming the file and the library — e.g. a crypto NIF
        # that links libcrypto.so.1.1 and so cannot boot on an OpenSSL-3 host.
        # Locally: scripts/check-release-shared-libs.sh _build/prod/rel/wardmast
        run: |
          bash scripts/check-release-shared-libs.sh "${TARBALL}"

      - name: Render the container build inputs for the GHCR job
        # KH7 (docs/design/remote-workers.md §20.8): the controller image and the
        # shared worker base are built from the Containerfiles the primary itself
        # uses (`mix wardmast.containerfile`), digest-pinned here, where Erlang/Elixir
        # already are; the publish-oci job below only needs docker and helm.
        # The controller tarball has a top-level `wardmast/` (the primary's own
        # layout), unlike the release asset, which unpacks to `.`.
        run: |
          mkdir -p dist
          (cd apps/wardmast \
            && mix wardmast.containerfile controller --pin --out "${GITHUB_WORKSPACE}/dist/Containerfile.controller" \
            && mix wardmast.containerfile worker-base --pin \
                 --out "${GITHUB_WORKSPACE}/dist/Containerfile.worker-base" \
                 --hash-out "${GITHUB_WORKSPACE}/dist/worker-base.hash")
          tar -czf dist/release.tar.gz -C _build/prod/rel wardmast

      - name: Upload the container build inputs
        uses: actions/upload-artifact@v4
        with:
          name: container-inputs
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Wardmast ${{ steps.tag.outputs.name }}"
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
            ${{ env.MANIFEST }}
            apps/wardmast_cli/ward
            ward.sha256
            arb
            arb.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS arm64 release (bd-6uq02m, epic "Arbiter on macOS"): the same OTP
  # release as `build`, compiled natively on Apple Silicon and published as
  # arbiter-<tag>-darwin-arm64.tar.gz (+ .sha256) onto the GitHub Release the
  # Linux job created.
  #
  # It `needs: build` so the release already exists (two jobs racing to create
  # it would fail one of them), and nothing needs *it*: publish-oci depends on
  # `build` only, so a broken macOS build can never hold back the Linux
  # tarball, the controller image or the chart. It does turn the run red, which
  # is the signal to fix it before the next tag.
  #
  # Differences from `build`, each deliberate:
  #   - no container: macOS has no ubi8 baseline; portability is instead the
  #     MACOSX_DEPLOYMENT_TARGET pin plus scripts/check-release-macho-libs.sh
  #     (system / relative dylibs only — the static OpenSSL guard).
  #   - OTP comes from scripts/build-release-otp.sh (darwin64-arm64-cc), cached
  #     under $HOME/otp (/opt is not writable on the runner) with its own key.
  #   - rustup ships on the runner image, so the pinned toolchain is selected
  #     with it rather than piped from sh.rustup.rs. The mdex NIF is still
  #     built from source (FORCE_BUILD_ALL) so it honours the deployment target
  #     instead of whatever target upstream's prebuilt artifact was made for.
  #   - tarball hygiene: COPYFILE_DISABLE stops bsdtar writing AppleDouble
  #     `._*` entries, and the systemd unit overlay is dropped (launchd is the
  #     macOS service manager).
  #   - no escript, migration manifest, container inputs: `build` publishes
  #     those once; they are platform-independent.
  build-macos:
    name: Build OTP Release (macOS arm64)
    needs: build
    runs-on: macos-15
    timeout-minutes: 90

    permissions:
      contents: write

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      ELIXIR_ERL_OPTIONS: "+fnu"
      MIX_ENV: prod
      ARB_BUILD_RELEASE_REPO: ${{ github.repository }}
      # Lowest macOS the tarball runs on. Read by clang (OpenSSL, OTP) and rustc
      # (the mdex NIF); scripts/build-release-otp.sh defaults to the same value.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      RUSTLER_PRECOMPILED_FORCE_BUILD_ALL: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Restore Erlang/OTP build cache
        id: otp-cache
        uses: actions/cache@v4
        with:
          path: ~/otp
          key: otp-static-openssl-macos15-arm64-${{ hashFiles('scripts/build-release-otp.sh') }}

      - name: Build Erlang/OTP 29 with static OpenSSL
        if: steps.otp-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/build-release-otp.sh --prefix "${HOME}/otp"

      - name: Put Erlang/OTP on PATH
        run: |
          echo "${HOME}/otp/bin" >> "$GITHUB_PATH"
          "${HOME}/otp/bin/erl" -noshell -eval 'ok = crypto:start(), io:format("~p~n", [crypto:info_lib()]), halt().'

      - name: Install Elixir 1.20
        run: |
          ELIXIR_VERSION="1.20.4"
          OTP_MAJOR="29"
          curl -fsSL "https://repo.hex.pm/builds/elixir/v${ELIXIR_VERSION}-otp-${OTP_MAJOR}.zip" -o "${RUNNER_TEMP}/elixir.zip"
          mkdir -p "${HOME}/elixir"
          unzip -q "${RUNNER_TEMP}/elixir.zip" -d "${HOME}/elixir"
          echo "${HOME}/elixir/bin" >> "$GITHUB_PATH"

      - name: Select the pinned Rust toolchain
        # Keep RUST_VERSION in step with the `build` job's Install Rust
        # toolchain step (and at or above the rust-version in
        # deps/mdex_native/native/mdex_native_nif/Cargo.toml). The runner image
        # carries rustup; install it only if a future image drops it.
        run: |
          RUST_VERSION="1.91.0"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="${HOME}/.cargo/bin:${PATH}"
          fi
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          cargo --version
          rustc --version

      - name: Bootstrap Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Determine tag name
        id: tag
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Get production dependencies
        run: |
          MIX_ENV=prod mix deps.get --only prod

      - name: Install asset build tools
        run: |
          MIX_ENV=prod mix cmd --app wardmast_web mix assets.setup
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}

      - name: Compile (prod)
        run: |
          MIX_ENV=prod mix compile
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}

      - name: Build and digest web assets
        run: |
          MIX_ENV=prod mix cmd --app wardmast_web mix assets.deploy

      - name: Build OTP release
        run: |
          MIX_ENV=prod mix release wardmast
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}

      - name: Build ward escript and smoke-test it on the bundled erts
        # bd-d5mg29: the tarball ships bin/ward + bin/ward.escript; `ward
        # --version` must work with only the release's erts on PATH (no system
        # Erlang), which is what a toolchain-free macOS install has.
        run: |
          (cd apps/wardmast_cli && MIX_ENV=prod mix escript.build)
          cp apps/wardmast_cli/ward _build/prod/rel/wardmast/bin/ward.escript
          scripts/check-release-ward.sh _build/prod/rel/wardmast apps/wardmast_cli/ward
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}
          MIX_ENV: prod

      - name: Ad-hoc codesign Mach-O files and verify
        # arm64 macOS refuses to run unsigned code. Sign every Mach-O file
        # (ad hoc, no identity) after the release is assembled and before it is
        # archived, then verify each signature.
        run: |
          REL="_build/prod/rel/wardmast"
          signed=0
          while IFS= read -r -d '' f; do
            case "$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')" in
              cffaedfe | feedfacf | cefaedfe | feedface | cafebabe | bebafeca) ;;
              *) continue ;;
            esac
            codesign --force -s - "$f"
            codesign --verify --strict "$f"
            signed=$((signed + 1))
          done < <(find "${REL}" -type f -print0)
          if [ "${signed}" -eq 0 ]; then
            echo "error: no Mach-O files found to sign under ${REL}" >&2
            exit 1
          fi
          echo "signed and verified ${signed} Mach-O file(s)"

      - name: Package and checksum release
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          TARBALL="arbiter-${TAG}-darwin-arm64.tar.gz"
          REL="_build/prod/rel/wardmast"
          # No systemd on macOS: drop the node agent's user unit overlay.
          rm -f "${REL}/share/arbiter-node/arbiter-node.service"
          # Strip extended attributes (quarantine / provenance) so they are not
          # archived, and keep bsdtar from emitting AppleDouble `._*` files.
          xattr -cr "${REL}"
          COPYFILE_DISABLE=1 tar -czf "${TARBALL}" -C "${REL}" .
          shasum -a 256 "${TARBALL}" > "${TARBALL}.sha256"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Check tarball hygiene
        run: |
          if tar -tzf "${TARBALL}" | grep -E '(^|/)(\._[^/]*|\.DS_Store|[^/]*\.service)$'; then
            echo "error: ${TARBALL} contains AppleDouble / .DS_Store / systemd files (listed above)" >&2
            exit 1
          fi

      - name: Check shipped binaries only link system libraries
        # The macOS analogue of the ubi8 shared-lib guard: a Homebrew dylib in
        # any Mach-O file fails the release here, naming file and library.
        run: |
          bash scripts/check-release-macho-libs.sh "${TARBALL}"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: "Wardmast ${{ needs.build.outputs.tag }}"
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-oci:
    name: Publish controller image, chart and worker base to GHCR
    # KH7 (OD6): the controller image, the wardmast-node chart and the worker base are
    # public artefacts of a tagged release. Optional cosign signing is behind the
    # `sign` dispatch input or the repository variable RELEASE_COSIGN=true; it is never
    # a gate. Operator checks after the first release: the package visibility on the
    # GHCR packages page (H7) and an arm64 node (H4, the image is linux/amd64 only).
    needs: build
    # Pinned: ubuntu-latest moved to 26.04 and breaks tests; see 26.04 follow-up ticket (#1529).
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      TAG: ${{ needs.build.outputs.tag }}
      SIGN: ${{ inputs.sign == true || vars.RELEASE_COSIGN == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Download the container build inputs
        uses: actions/download-artifact@v4
        with:
          name: container-inputs
          path: dist/

      - name: Work out names and versions
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          # Chart `version` / `appVersion` and the image tag are the release without the
          # leading v: the chart's image tag defaults to its appVersion.
          VERSION="${TAG#v}"
          {
            echo "CONTROLLER=ghcr.io/${OWNER}/wardmast-controller"
            echo "WORKER_BASE=ghcr.io/${OWNER}/wardmast-worker-base"
            echo "CHARTS=oci://ghcr.io/${OWNER}/charts"
            echo "CHART_REPO=ghcr.io/${OWNER}/charts/wardmast-node"
            echo "VERSION=${VERSION}"
            echo "BASE_HASH=$(tr -d '[:space:]' < dist/worker-base.hash)"
            echo "BASE_IMAGE=$(grep -m1 '^FROM ' dist/Containerfile.controller | cut -d' ' -f2)"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the controller image
        id: controller
        uses: docker/build-push-action@v6
        with:
          # The Containerfile ADDs release.tar.gz from the context and copies nothing
          # else, so the rest of dist/ stays out of the image.
          context: dist
          file: dist/Containerfile.controller
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.CONTROLLER }}:${{ env.VERSION }}
            ${{ env.CONTROLLER }}:${{ env.TAG }}
          # `source` links the package to this repository, which is what lets a
          # public repository's package inherit public visibility (H7).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=FSL-1.1-ALv2
            org.opencontainers.image.description=Wardmast controller (open-core release)
            arbiter.base-image=${{ env.BASE_IMAGE }}

      - name: Build and push the worker base
        id: base
        shell: bash
        run: |
          REF="${WORKER_BASE}:${BASE_HASH}"
          # The tag is the content hash of the pinned Containerfile: an existing tag is
          # already this base, and re-pushing would only move its digest.
          if docker buildx imagetools inspect "${REF}" >/dev/null 2>&1; then
            echo "${REF} already published"
            docker buildx imagetools inspect "${REF}" --format '{{.Manifest.Digest}}' \
              | sed 's/^/digest=/' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "${RUNNER_TEMP}/empty-context"
          # Build once with --load, smoke it, then push that very image (retagged), so the
          # published base is exactly the one that was tested.
          docker buildx build --platform linux/amd64 --load \
            --file dist/Containerfile.worker-base \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.licenses=FSL-1.1-ALv2" \
            --label "org.opencontainers.image.description=Wardmast shared worker image base" \
            --tag worker-base-smoke \
            "${RUNNER_TEMP}/empty-context"
          scripts/worker-image-smoke.sh worker-base-smoke docker
          echo "worker base chromium: $(docker run --rm --entrypoint /bin/sh worker-base-smoke -c '"$ARB_CHROME" --version')" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "worker base size: $(docker image inspect worker-base-smoke --format '{{.Size}}') bytes" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          docker tag worker-base-smoke "${REF}"
          docker push "${REF}" | tee "${RUNNER_TEMP}/base-push.log"
          digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' "${RUNNER_TEMP}/base-push.log" | tail -n1)"
          test -n "${digest}" || { echo "docker push printed no digest" >&2; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push the chart
        id: chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package charts/wardmast-node --version "${VERSION}" --app-version "${VERSION}" --destination dist
          echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          helm push "dist/wardmast-node-${VERSION}.tgz" "${CHARTS}" 2>&1 | tee "${RUNNER_TEMP}/helm-push.log"
          DIGEST="$(sed -n 's/^Digest: //p' "${RUNNER_TEMP}/helm-push.log")"
          test -n "${DIGEST}" || { echo "helm push printed no digest" >&2; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: env.SIGN == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign the images and the chart (cosign, keyless)
        if: env.SIGN == 'true'
        # Identity is this workflow's GitHub OIDC token; verify with
        #   cosign verify <ref>@<digest> --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     --certificate-identity-regexp '^https://github.com/<owner>/<repo>/\.github/workflows/release\.yml@'
        run: |
          cosign sign --yes "${CONTROLLER}@${{ steps.controller.outputs.digest }}"
          cosign sign --yes "${WORKER_BASE}@${{ steps.base.outputs.digest }}"
          cosign sign --yes "${CHART_REPO}@${{ steps.chart.outputs.digest }}"

      - name: Summary
        run: |
          {
            echo "### GHCR artefacts for ${TAG}"
            echo "- controller: \`${CONTROLLER}:${VERSION}@${{ steps.controller.outputs.digest }}\`"
            echo "- worker base: \`${WORKER_BASE}:${BASE_HASH}@${{ steps.base.outputs.digest }}\`"
            echo "- chart: \`${CHARTS}/wardmast-node:${VERSION}@${{ steps.chart.outputs.digest }}\`"
            echo "- cosign: ${SIGN}"
            echo
            echo "First release only: check the three packages are public (Package settings, Change visibility)."
          } >> "$GITHUB_STEP_SUMMARY"
